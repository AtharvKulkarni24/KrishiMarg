# Server Configuration
server.port=8080

# Application Name
spring.application.name=krishimarg-backend

# Database Configuration (PostgreSQL default)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/krishimarg}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Atharv@24}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Route Optimizer (Python OR-Tools Engine)
route.optimizer.url=${ROUTE_OPTIMIZER_URL:http://localhost:8000/api/v1/optimize-route}
route.optimizer.connect-timeout-ms=${ROUTE_OPTIMIZER_CONNECT_TIMEOUT_MS:5000}
route.optimizer.read-timeout-ms=${ROUTE_OPTIMIZER_READ_TIMEOUT_MS:10000}

# Logistics Payout Configuration
logistics.driver.base-fare=200.00
logistics.driver.per-km-rate=25.00

# Jackson Configuration
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.indent-output=true

# Logging
logging.level.com.krishimarg.backend=DEBUG
logging.level.org.springframework.web=INFO
