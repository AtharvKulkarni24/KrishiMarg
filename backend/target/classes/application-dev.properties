# Dev Profile - H2 In-Memory DB (No external Postgres required)
spring.datasource.url=jdbc:h2:mem:krishimarg;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Route Optimizer
route.optimizer.url=${ROUTE_OPTIMIZER_URL:http://localhost:8000/api/v1/optimize-route}
route.optimizer.connect-timeout-ms=5000
route.optimizer.read-timeout-ms=10000

# Logistics Payout Configuration
logistics.driver.base-fare=200.00
logistics.driver.per-km-rate=25.00
